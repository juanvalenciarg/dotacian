<!DOCTYPE html>
<html lang="es">

<head>
  <!-- Google Tag Manager -->
  <script async src="https://www.googletagmanager.com/gtm.js?id=GTM-W2MTLN9M"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
  </script>
  <!-- End Google Tag Manager -->
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión admin | Dotacian</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    :root {
      --ink: #05080F;
      --ink-2: #0A101C;
      --brand: #06B6D4;
      --brand-hi: #22D3EE;
      --brand-soft: #67E8F9;
    }

    html,
    body {
      background: var(--ink) !important;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      width: 100%;
      font-family: 'Inter', sans-serif;
    }

    /* Página oscura con el punto de la marca asomando en la esquina */
    .auth-page {
      width: 100%;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(700px 520px at 12% 0%, rgba(6, 182, 212, 0.16), transparent 70%),
        var(--ink) !important;
      padding: 2rem;
      box-sizing: border-box;
      position: relative;
      overflow: hidden;
    }

    .brand-dot {
      position: absolute;
      width: 460px;
      height: 460px;
      right: -170px;
      bottom: -190px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 140px rgba(6, 182, 212, 0.45);
      pointer-events: none;
    }
    .brand-dot::after {
      content: "";
      position: absolute;
      inset: -46px;
      border-radius: 50%;
      border: 1px solid rgba(103, 232, 249, 0.22);
    }

    .auth-card {
      background: rgba(10, 16, 28, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: white;
      width: 100%;
      max-width: 440px;
      border-radius: 28px;
      padding: 3.25rem 3rem 2.75rem;
      box-shadow: 0 50px 100px -40px rgba(0, 0, 0, 0.8);
      position: relative;
      z-index: 10;
    }

    .auth-header {
      text-align: center;
      margin-bottom: 2.25rem;
    }

    .logo a { display: inline-block; }

    .logo .wordmark {
      display: block;
      width: 150px;
      aspect-ratio: 1935 / 343;
      color: #fff;
      background: linear-gradient(90deg, currentColor 0 94.9%, var(--brand) 94.9% 100%);
      -webkit-mask: url('/assets/logos/wordmark.png') center / contain no-repeat;
      mask: url('/assets/logos/wordmark.png') center / contain no-repeat;
    }

    .admin-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--brand-soft);
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.16em;
      margin: 1.75rem 0 0.9rem;
      font-family: 'Inter', sans-serif;
    }
    .admin-badge::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--brand);
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
    }

    .auth-header h2 {
      font-family: 'Outfit', sans-serif;
      font-size: 2.1rem;
      font-weight: 700;
      color: white;
      margin: 0 0 0.6rem;
      letter-spacing: -0.035em;
      line-height: 1.05;
    }
    .bdot { color: var(--brand); }

    .auth-header p {
      color: #94A3B8;
      font-size: 0.9375rem;
      line-height: 1.55;
      margin: 0;
    }

    .form-group {
      margin-bottom: 1.25rem;
    }

    .form-group label {
      display: block;
      font-size: 0.8rem;
      font-weight: 600;
      color: #CBD5E1;
      margin-bottom: 0.55rem;
    }

    .form-group input {
      width: 100%;
      padding: 0.95rem 1.1rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      font-size: 0.95rem;
      font-family: 'Inter', sans-serif;
      color: white;
      transition: border-color .2s, box-shadow .2s, background-color .2s;
      box-sizing: border-box;
    }

    .form-group input::placeholder {
      color: rgba(255, 255, 255, 0.3);
    }

    .form-group input:focus {
      border-color: var(--brand);
      background: rgba(255, 255, 255, 0.06);
      box-shadow: 0 0 0 4px rgba(6, 182, 212, 0.18);
      outline: none;
    }

    .btn-admin {
      width: 100%;
      padding: 1rem;
      background: var(--brand);
      color: var(--ink);
      border: none;
      border-radius: 999px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: background-color .2s, transform .2s, box-shadow .2s;
      margin-top: 0.75rem;
      font-family: 'Outfit', sans-serif;
      box-shadow: 0 16px 36px -14px rgba(6, 182, 212, 0.8);
    }

    .btn-admin:hover {
      background: var(--brand-hi);
      transform: translateY(-2px);
      box-shadow: 0 20px 40px -14px rgba(6, 182, 212, 0.9);
    }

    .btn-admin:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .auth-footer {
      text-align: center;
      margin-top: 1.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      font-size: 0.875rem;
      color: #94A3B8;
    }

    .auth-footer a {
      color: var(--brand-soft);
      text-decoration: none;
      font-weight: 600;
    }

    .auth-footer a:hover {
      text-decoration: underline;
    }

    @media (max-width: 520px) {
      .auth-page { padding: 1.25rem; }
      .auth-card { padding: 2.5rem 1.6rem 2rem; border-radius: 24px; }
      .auth-header h2 { font-size: 1.8rem; }
      .brand-dot { width: 300px; height: 300px; right: -150px; bottom: -150px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .btn-admin, .btn-admin:hover { transition: none; transform: none; }
    }

    /* Error Alert */
    #login-error-alert {
      display: none;
      background: #FEF2F2;
      border: 1px solid #FEE2E2;
      color: #B91C1C;
      padding: 1rem;
      border-radius: 1rem;
      margin-bottom: 1.5rem;
      font-size: 0.875rem;
      font-weight: 500;
      align-items: center;
      gap: 0.75rem;
    }
  </style>
</head>

<body>
  <div class="auth-page">
    <div class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <a href="/" aria-label="Dotacian, ir al inicio">
            <span class="wordmark" aria-hidden="true"></span>
          </a>
        </div>
        <div class="admin-badge">Admin Portal</div>
        <h2>Centro de Control<span class="bdot">.</span></h2>
        <p>Inicia sesión para gestionar empresas,<br>pedidos, diseños y mucho más.</p>
      </div>

      <form class="auth-form">
        <div id="login-error-alert">
          <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="8" x2="12" y2="12"></line>
            <line x1="12" y1="16" x2="12.01" y2="16"></line>
          </svg>
          <span id="error-message-text"></span>
        </div>

        <div class="form-group">
          <label for="email">Correo Electrónico</label>
          <input type="email" id="email" placeholder="admin@dotacian.com" required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <div style="position: relative;">
            <input type="password" id="password" placeholder="••••••••" required style="padding-right: 3rem;">
            <button type="button" onclick="togglePasswordVisibility('password', this)"
              style="position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; color: #94A3B8; display: flex; align-items: center; justify-content: center; padding: 0;">
              <svg id="eye-icon" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"
                viewBox="0 0 24 24">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="btn-admin">
          Acceder al Panel
        </button>
      </form>

      <div class="auth-footer">
        ¿No eres administrador? <a href="login.html">Regresar al portal de clientes</a>
      </div>
    </div>
    <div class="brand-dot" aria-hidden="true"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="assets/js/utils.js?v=4"></script>

  <script>
    const SUPABASE_URL = 'https://awuhvewotmwelurmjvmu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4WG86Fal8RQ3tV0sNXZIow_hikHt0Aq';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: 'dotacian-admin-token' } });

    document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('error') === 'unauthorized') {
        const errorAlert = document.getElementById('login-error-alert');
        const errorText = document.getElementById('error-message-text');
        errorText.textContent = 'Tu sesión fue cerrada porque no tienes privilegios de administrador.';
        errorAlert.style.display = 'flex';

        // Limpiar la URL para que no persista el mensaje si recarga
        window.history.replaceState({}, document.title, window.location.pathname);
      }
    });

    function togglePasswordVisibility(inputId, btn) {
      const input = document.getElementById(inputId);
      const icon = btn.querySelector('svg');
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>';
      } else {
        input.type = 'password';
        icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>';
      }
    }

    const loginForm = document.querySelector('.auth-form');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();

        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const submitBtn = loginForm.querySelector('.btn-admin');

        submitBtn.disabled = true;
        submitBtn.textContent = 'Verificando...';

        const errorAlert = document.getElementById('login-error-alert');
        const errorText = document.getElementById('error-message-text');
        errorAlert.style.display = 'none';

        try {
          const { data: authData, error: authError } = await _supabase.auth.signInWithPassword({
            email: email,
            password: password,
          });

          if (authError) {
            errorText.textContent = 'Credenciales no autorizadas o incorrectas.';
            errorAlert.style.display = 'flex';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Acceder al Panel';
            return;
          }

          // Verificar si el usuario está en admin_profile
          const userId = authData.user.id;
          const { data: adminData, error: adminError } = await _supabase
            .from('admin_profile')
            .select('*')
            .eq('id', userId)
            .maybeSingle();

          if (adminError || !adminData) {
            // No es administrador, cerramos sesión
            await _supabase.auth.signOut();
            errorText.textContent = 'Acceso denegado: No tienes privilegios de administrador.';
            errorAlert.style.display = 'flex';
            submitBtn.disabled = false;
            submitBtn.textContent = 'Acceder al Panel';
            return;
          }

          window.location.href = 'admin.html';

        } catch (err) {
          submitBtn.disabled = false;
          submitBtn.textContent = 'Acceder al Panel';
        }
      });
    }
    // Comprobar si hubo un rebote por timeout
    const urlParams = new URLSearchParams(window.location.search);
    const reason = urlParams.get('reason');
    if (reason === 'timeout') {
      const errorAlert = document.getElementById('login-error-alert');
      const errorText = document.getElementById('error-message-text');
      if (errorAlert && errorText) {
        errorText.textContent = 'Tu sesión se cerro por seguridad, vuelve a iniciar sesión';
        errorAlert.style.background = '#FFFBEB';
        errorAlert.style.color = '#D97706';
        errorAlert.style.borderColor = '#FCD34D';
        errorAlert.style.display = 'flex';
      }
    }
  </script>
</body>

</html>
