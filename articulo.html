  <!DOCTYPE html>
<html lang="es">

<head>
  <link rel="icon" type="image/svg+xml" href="assets/logos/favicon.svg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Artículo | Dotacian</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap"
    rel="stylesheet">

  <link rel="stylesheet" href="styles.css">

  <style>
    .article-header {
      background: linear-gradient(135deg, #020617 0%, #0F172A 100%);
      padding: 12rem 2rem 6rem 2rem;
      color: white;
      text-align: center;
      position: relative;
      margin-top: 0;
      overflow: hidden;
    }

    .article-header::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -10%;
      width: 50%;
      height: 150%;
      background: radial-gradient(circle, rgba(6, 182, 212, 0.15) 0%, transparent 70%);
      transform: rotate(-45deg);
      pointer-events: none;
    }

    .article-header::after {
      content: '';
      position: absolute;
      bottom: -30%;
      right: -10%;
      width: 40%;
      height: 100%;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.1) 0%, transparent 70%);
      pointer-events: none;
    }

    .article-back {
      position: absolute;
      top: 8rem;
      left: 2rem;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 600;
      transition: color 0.2s;
      z-index: 10;
    }

    .article-back:hover {
      color: white;
    }

    .article-meta {
      font-size: 0.95rem;
      color: var(--color-cyan);
      margin-bottom: 1rem;
      display: flex;
      justify-content: center;
      gap: 1.5rem;
      font-weight: 500;
    }

    .article-title {
      font-family: var(--font-family-heading);
      font-size: 3.5rem;
      font-weight: 800;
      line-height: 1.2;
      max-width: 900px;
      margin: 0 auto 2rem auto;
      position: relative;
      z-index: 10;
      letter-spacing: -0.02em;
    }

    .article-hero-image {
      width: 100%;
      max-width: 1000px;
      height: 400px;
      object-fit: cover;
      border-radius: 1rem;
      margin: -2rem auto 3rem auto;
      display: block;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      position: relative;
      z-index: 20;
    }

    .article-content {
      max-width: 800px;
      margin: 0 auto 4rem auto;
      font-size: 1.15rem;
      line-height: 1.8;
      color: #334155;
      padding: 0 2rem;
    }

    .article-content h2 {
      font-family: var(--font-family-heading);
      font-size: 2rem;
      font-weight: 700;
      color: #0F172A;
      margin: 3rem 0 1.5rem 0;
      letter-spacing: -0.01em;
    }

    .article-content h3 {
      font-family: var(--font-family-heading);
      font-size: 1.5rem;
      font-weight: 600;
      color: #1E293B;
      margin: 2.5rem 0 1rem 0;
    }

    .article-content p {
      margin-bottom: 1.5rem;
    }

    .article-content ul, .article-content ol {
      margin-bottom: 1.5rem;
      padding-left: 1.5rem;
    }

    .article-content li {
      margin-bottom: 0.5rem;
    }

    .article-content blockquote {
      border-left: 4px solid var(--color-cyan);
      padding-left: 1.5rem;
      font-style: italic;
      color: var(--color-text-secondary);
      margin: 2rem 0;
      font-size: 1.25rem;
    }

    .article-lang-switch {
      position: absolute;
      top: 8rem;
      right: 2rem;
      color: rgba(255, 255, 255, 0.7);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 600;
      font-size: 0.9rem;
      transition: color 0.2s;
      z-index: 10;
    }

    .article-lang-switch:hover {
      color: white;
    }
  </style>
</head>

<body>

  <header class="header">
    <div class="container">
      <div class="logo">
        <a href="index.html" id="logo-link">
          <img src="assets/logos/logo_dotacian.png" alt="dotacian logo"
            style="height: 50px; width: auto; display: block; filter: brightness(0) invert(1);">
        </a>
      </div>
      <div style="display: flex; align-items: center; gap: 2rem;">
        <nav class="nav-links" style="display: flex; gap: 1.5rem;">
          <a href="index.html#como-funciona" id="nav-product" style="color: white; font-weight: 600;">Producto</a>
          <a href="blog.html" id="nav-resources" style="color: white; font-weight: 600;">Recursos</a>
        </nav>
        <div class="header-actions">
          <a href="index.html#agendar-demo" id="nav-demo" class="btn"
            style="background-color: var(--color-cyan); color: var(--color-navy); border: none; font-weight: 700;">Agendar
            Demo</a>
          <button class="header-mobile-toggle" id="mobile-menu-toggle" aria-label="Abrir menú">
            <span style="background-color: white;"></span>
            <span style="background-color: white;"></span>
            <span style="background-color: white;"></span>
          </button>
        </div>
      </div>
    </div>
  </header>

  <div class="mobile-drawer" id="mobile-drawer">
    <div class="drawer-header">
      <div class="logo" style="margin-bottom: 2rem;">
        <img src="assets/logos/logo_dotacian.png" alt="dotacian logo" loading="lazy"
          style="height: 60px; width: auto; display: block; margin: 0 auto;">
      </div>
      <button class="drawer-close" id="drawer-close">&times;</button>
    </div>
    <nav class="drawer-nav">
      <a href="index.html#como-funciona" id="drawer-product" style="font-weight: 600;">Producto</a>
      <a href="blog.html" id="drawer-resources" style="font-weight: 600;">Recursos</a>
      <div class="drawer-divider"></div>
      <a href="index.html#agendar-demo" id="drawer-demo" class="btn"
        style="background-color: var(--color-cyan); color: var(--color-navy); border: none; font-weight: 700; text-align: center; margin-top: 1rem;">Agendar
        Demo</a>
    </nav>
  </div>

  <div id="article-container">
    <div style="text-align: center; padding: 6rem; color: var(--color-text-muted);">
      Cargando artículo...
    </div>
  </div>

  <!-- Footer Simple -->
  <footer
    style="background: #0F172A; color: white; padding: 4rem 2rem 2rem 2rem; text-align: center; margin-top: 4rem;">
    <div style="max-width: 1200px; margin: 0 auto;">
      <img src="assets/logos/logo_dotacian.png" alt="Dotacian" style="height: 40px; margin-bottom: 1.5rem;">
      <p style="color: rgba(255,255,255,0.6); font-size: 0.875rem;">© 2026 Dotacian. Todos los derechos reservados.</p>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    // Supabase Configuration
    const SUPABASE_URL = 'https://awuhvewotmwelurmjvmu.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_4WG86Fal8RQ3tV0sNXZIow_hikHt0Aq';
    const _supabaseBlog = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // Mobile Drawer Logic
    const toggleBtn = document.getElementById('mobile-menu-toggle');
    const closeBtn = document.getElementById('drawer-close');
    const drawer = document.getElementById('mobile-drawer');

    const toggleMenu = () => {
      drawer.classList.toggle('active');
      toggleBtn.classList.toggle('open');
      document.body.style.overflow = drawer.classList.contains('active') ? 'hidden' : '';
    };

    if (toggleBtn) toggleBtn.addEventListener('click', toggleMenu);
    if (closeBtn) closeBtn.addEventListener('click', () => {
      drawer.classList.remove('active');
      toggleBtn.classList.remove('open');
      document.body.style.overflow = '';
    });

    const STRINGS = {
      es: {
        product: 'Producto', resources: 'Recursos', demo: 'Agendar Demo',
        indexHref: 'index.html', blogHref: 'blog.es.html',
        back: 'Volver', by: 'Por', dateLocale: 'es-ES',
        switchLangLabel: 'Read in English',
        notFound: 'Artículo no encontrado.', backToBlog: 'Volver al blog',
        loadError: 'El artículo no existe o hubo un error al cargarlo.',
        titleSuffix: 'Blog Dotacian'
      },
      en: {
        product: 'Product', resources: 'Resources', demo: 'Book a demo',
        indexHref: 'index.html', blogHref: 'blog.html',
        back: 'Back', by: 'By', dateLocale: 'en-US',
        switchLangLabel: 'Leer en Español',
        notFound: 'Article not found.', backToBlog: 'Back to blog',
        loadError: "This article doesn't exist or there was an error loading it.",
        titleSuffix: 'Dotacian Blog'
      }
    };

    function applyHeaderLang(lang) {
      const s = STRINGS[lang] || STRINGS.es;
      document.documentElement.lang = lang;
      document.getElementById('logo-link').href = s.indexHref;
      document.getElementById('nav-product').href = `${s.indexHref}#como-funciona`;
      document.getElementById('nav-product').textContent = s.product;
      document.getElementById('nav-resources').href = s.blogHref;
      document.getElementById('nav-resources').textContent = s.resources;
      document.getElementById('nav-demo').href = `${s.indexHref}#agendar-demo`;
      document.getElementById('nav-demo').textContent = s.demo;
      document.getElementById('drawer-product').href = `${s.indexHref}#como-funciona`;
      document.getElementById('drawer-product').textContent = s.product;
      document.getElementById('drawer-resources').href = s.blogHref;
      document.getElementById('drawer-resources').textContent = s.resources;
      document.getElementById('drawer-demo').href = `${s.indexHref}#agendar-demo`;
      document.getElementById('drawer-demo').textContent = s.demo;
    }

    async function loadArticle() {
      const container = document.getElementById('article-container');
      const urlParams = new URLSearchParams(window.location.search);
      const slug = urlParams.get('slug');

      if (!slug) {
        container.innerHTML = `
          <div style="text-align: center; padding: 6rem; color: #EF4444;">
            Artículo no encontrado. <a href="blog.html" style="color: var(--color-cyan);">Volver al blog</a>
          </div>
        `;
        return;
      }

      try {
        const { data: post, error } = await _supabaseBlog
          .from('blog_posts')
          .select('*')
          .eq('slug', slug)
          .single();

        if (error || !post) {
          throw error || new Error("Not found");
        }

        const lang = post.lang === 'en' ? 'en' : 'es';
        const s = STRINGS[lang];
        applyHeaderLang(lang);

        let translationLink = '';
        if (post.translation_group_id) {
          const { data: sibling } = await _supabaseBlog
            .from('blog_posts')
            .select('slug, lang')
            .eq('translation_group_id', post.translation_group_id)
            .neq('id', post.id)
            .maybeSingle();
          if (sibling) {
            const label = sibling.lang === 'en' ? STRINGS.es.switchLangLabel : STRINGS.en.switchLangLabel;
            translationLink = `
              <a href="articulo.html?slug=${sibling.slug}" class="article-lang-switch">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/>
                </svg>
                ${label}
              </a>`;
          }
        }

        // --- View Tracking Logic ---
        const viewKey = `viewed_article_${post.id}`;
        const hasViewed = localStorage.getItem(viewKey);

        let newTotal = (post.views_total || 0) + 1;
        let newUnique = post.views_unique || 0;

        if (!hasViewed) {
          newUnique += 1;
          localStorage.setItem(viewKey, 'true');
        }

        // Update without blocking page load
        _supabaseBlog.from('blog_posts').update({
          views_total: newTotal,
          views_unique: newUnique
        }).eq('id', post.id).then(({ error }) => {
          if (error) console.error("Error updating views", error);
        });
        // ---------------------------

        const dateObj = new Date(post.created_at);
        const dateString = dateObj.toLocaleDateString(s.dateLocale, { year: 'numeric', month: 'long', day: 'numeric' });
        const imageSrc = post.image_url ? post.image_url : 'assets/images/hero_image.png';
        const defaultAuthor = lang === 'en' ? 'Dotacian Team' : 'Equipo Dotacian';

        document.title = `${post.title} | ${s.titleSuffix}`;

        container.innerHTML = `
          <section class="article-header">
            <a href="${s.blogHref}" class="article-back">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 12H5M12 19l-7-7 7-7"/>
              </svg>
              ${s.back}
            </a>
            ${translationLink}
            <div class="article-meta">
              <span>${s.by} ${post.author || defaultAuthor}</span>
            </div>
            <h1 class="article-title">${post.title}</h1>
          </section>

          <img src="${imageSrc}" alt="${post.title}" class="article-hero-image">

          <article class="article-content">
            <!-- Para un MVP, renderizamos el HTML directamente si el admin lo escribió así,
                 o reemplazamos los saltos de línea por <br> si es texto plano -->
            ${post.content.includes('<') ? post.content : post.content.replace(/\\n/g, '<br><br>')}
          </article>
        `;
      } catch (err) {
        console.error('Error loading article:', err);
        container.innerHTML = `
          <div style="text-align: center; padding: 6rem; color: #EF4444;">
            El artículo no existe o hubo un error al cargarlo. <br><br>
            <a href="blog.html" style="color: var(--color-cyan); font-weight: bold; text-decoration: none;">Volver al blog</a>
          </div>
        `;
      }
    }

    document.addEventListener('DOMContentLoaded', loadArticle);
  </script>
</body>

</html>
